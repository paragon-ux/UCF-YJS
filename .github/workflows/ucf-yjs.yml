name: UCF-YJS

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      UCF_RS_ORACLE_ROOT: ${{ github.workspace }}/UCF-RS
      UCF_RS_ORACLE_REF: 639f6d7ee368d4d057189dfca64042241b1b6516
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: paragon-ux/UCF-RS
          ref: ${{ env.UCF_RS_ORACLE_REF }}
          path: UCF-RS
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --version
      - run: npm --version
      - run: python --version
      - name: Record Linux version
        if: runner.os == 'Linux'
        run: |
          uname -a
          cat /etc/os-release
      - name: Record Windows version
        if: runner.os == 'Windows'
        run: |
          [System.Environment]::OSVersion.VersionString
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:conformance
      - run: npm run test:conformance-oracle
      - run: npm run test:convergence
      - run: npm run test:e2e
      - run: npm run test:migrations
      - run: npm run test:corruption
      - run: npm run test:recovery
      - run: npm run test:locking
      - run: npm run test:public-api
